<!DOCTYPE html>
<html lang="ja">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ==========================================================
       Basic Metadata
  =========================================================== -->

  <title>Furna | Furniture Discovery Platform</title>

  <meta
    name="description"
    content="家具の名前や種類を見つけ、知り、比べられる家具探索サービス。質問に答えるだけで家具を探し、家具図鑑としても活用できます。"
  />

  <meta
    name="keywords"
    content="家具, 家具検索, 家具診断, 家具図鑑, 椅子, ソファ, テーブル, インテリア, Furna"
  />

  <meta name="author" content="Furna" />

  <meta name="theme-color" content="#74AF39" />

  <link rel="canonical" href="https://furna.jp/" />

 <!-- Favicon -->

<link
  rel="icon"
  type="image/png"
  href="/favicon-96x96.png"
  sizes="96x96"
/>

<link rel="icon" href="/favicon.ico" sizes="any" />

<link rel="icon" type="image/svg+xml" href="/favicon.svg" />

<link
  rel="apple-touch-icon"
  href="/apple-touch-icon.png"
/>

  <!-- ==========================================================
       Web Manifest
  =========================================================== -->

  <link rel="manifest" href="/site.webmanifest" />

  <!-- ==========================================================
       Open Graph
  =========================================================== -->

  <meta property="og:type" content="website" />

  <meta property="og:site_name" content="Furna" />

  <meta property="og:title" content="Furna" />

  <meta
    property="og:description"
    content="家具の名前や種類を見つけ、知り、比べられる家具探索サービス。"
  />

  <meta property="og:url" content="https://furna.jp/" />

  <meta
    property="og:image"
    content="https://furna.jp/og-image.png"
  />

  <meta property="og:locale" content="ja_JP" />

  <!-- ==========================================================
       Twitter / X Card
  =========================================================== -->

  <meta
    name="twitter:card"
    content="summary_large_image"
  />

  <meta
    name="twitter:title"
    content="Furna"
  />

  <meta
    name="twitter:description"
    content="家具の名前や種類を見つけ、知り、比べられる家具探索サービス。"
  />

  <meta
    name="twitter:image"
    content="https://furna.jp/og-image.png"
  />

  <!-- ==========================================================
       Apple Web App
  =========================================================== -->

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  />

  <meta
    name="apple-mobile-web-app-title"
    content="Furna"
  />

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  />

  <link rel="stylesheet" href="style.css" />

</head>

<body>

  <div class="app" id="app"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>

</body>
</html>
