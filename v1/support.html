<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Support | Furna</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/pages.css">
</head>

<body>

<div data-common-header></div>

<main class="site-main">

  <section class="page-hero">

    <div class="page-hero__content">

      <span class="page-hero__eyebrow">
        Support
      </span>

      <h1 class="page-hero__title">
        サポート
      </h1>

      <p class="page-hero__description">
        Furnaについてのご質問やお問い合わせはこちらからご利用ください。
      </p>

    </div>

    <div class="image-placeholder"></div>

  </section>


  <section class="page-section">

    <h2 class="page-section__title">
      よくあるご質問
    </h2>

    <div class="card-grid">

      <article class="card">
        <h3 class="card__title">
          Furnaとは何ですか？
        </h3>

        <p class="card__text">
          家具を記憶・特徴・用途から探せる家具探索サービスです。
        </p>
      </article>

      <article class="card">
        <h3 class="card__title">
          利用料金はかかりますか？
        </h3>

        <p class="card__text">
          基本機能は無料でご利用いただけます。
        </p>
      </article>

      <article class="card">
        <h3 class="card__title">
          対応OSは？
        </h3>

        <p class="card__text">
          iOS版を公開予定です。
        </p>
      </article>

    </div>

  </section>


  <section class="page-section">

    <h2 class="page-section__title">
      お問い合わせ
    </h2>

    <div class="card">

      <h3 class="card__title">
        メール
      </h3>

      <p class="card__text">
        support@furna.jp
      </p>

    </div>

  </section>


  <section class="cta-section">

    <h2>
      ご意見・ご要望をお待ちしています
    </h2>

    <p>
      Furnaをより良いサービスにするため、
      お気づきの点や改善のご提案をぜひお寄せください。
    </p>

  </section>

</main>

<div data-common-footer></div>

<script src="./js/common.js"></script>

</body>
</html>
